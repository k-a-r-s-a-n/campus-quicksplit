name: campus_quicksplit
description: "Split Smart. Settle Fast. Local-first peer expense tracker for Indian college students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  font_awesome_flutter: ^11.0.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#F5F7FF"
  color_dark: "#0B0F1E"
  image: assets/splash_logo.png
  branding: assets/splash_branding.png
  android_12:
    color: "#F5F7FF"
    image: assets/splash_logo.png

flutter:
  uses-material-design: true